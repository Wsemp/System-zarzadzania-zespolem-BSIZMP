<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskomat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        a { text-decoration: none;}
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'main_view' %}">Taskomat</a>

            {% if user.is_authenticated %}
                <div style="display: flex; flex-direction: row; justify-content: space-evenly; width:800px; font-weight: bold; color: #0d6efd;">
                    <div>Projekty</div>
                    <div>
                        <a href="{% url 'tasks_view' %}">Zadania</a>
                    </div>
                    <div>
                        <a href="{% url 'users_view' %}">Użytkownicy</a>
                    </div>
                </div>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary">Logout</button>
                </form>
            {% endif %}
        </div>
    </nav>

  <div class="container mt-5">
      {% block content %}
      {% endblock %}
  </div>

</body>
</html>

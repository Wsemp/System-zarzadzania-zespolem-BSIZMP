{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

    <div class="d-flex justify-content-center align-items-center flex-column">
        <h2 class="text-center mb-4">Stwórz użytkownika</h2>
        <div class="shadow-lg p-4 bg-white rounded" style="width: 100%; max-width: 400px;">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100">Dodaj użytkownika</button>
            </form>
        </div>
    </div>

{% endblock %}

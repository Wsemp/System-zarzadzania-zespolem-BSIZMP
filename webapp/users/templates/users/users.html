<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <p>Liczba wszystkich uzytkownikow: {{users_count}}</p>
    <p>Liczba uzytkownikow: {{common_users_count}}</p>
    <p>Liczba administratorow: {{admin_users_count}}</p>

    {% for user in users %}
        <p>{{ user.id }}</p>
        <p>{{ user.username }}</p>
        <a href="{% url 'delete_user' user.id %}">Usuń</a>
    {% endfor %}
</body>
</html>

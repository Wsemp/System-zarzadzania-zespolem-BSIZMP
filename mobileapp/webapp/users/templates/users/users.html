{% extends "base.html" %}

{% block content %}

    <div style="box-shadow: 0 4px 10px rgba(0,0,0,0.2); padding: 35px;">
        <div style="display: flex; justify-content: flex-start; flex-wrap: wrap; align-items: center; gap: 16px; max-height: 400px; overflow-y: auto;">
            {% for user in users %}
                <div class="card" style="width: 18rem;">
                  <div class="card-body">
                    <h5 class="card-title">{{ user.username }}</h5>
                      <hr>
                      {% if user.is_staff %}
                        <p class="card-text">Administrator</p>
                      {% else %}
                        <p class="card-text">Użytkownik</p>
                      {% endif %}
                    <a href="{% url 'user_update' user.id %}" class="btn btn-primary">Update</a>
                    <a href="{% url 'delete_user' user.id %}" class="btn btn-danger">Delete</a>
                  </div>
                </div>

            {% endfor %}
        </div>
    </div>

    <button type="button" class="btn btn-link">
        <a href="{% url 'user_create' %}">Utworz uzytkownika</a>
    </button>
{% endblock %}

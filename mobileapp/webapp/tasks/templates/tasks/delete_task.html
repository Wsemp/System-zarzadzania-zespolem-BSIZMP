<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form method="post" action="{% url 'delete_task' task.id %}">
        {% csrf_token %}
        <h4>Are you sure you want to delete this task: {{task.title}}</h4>

        <button type="submit">Delete</button>
        <button>
            <a href="{% url 'tasks_view' %}">
                Anuluj
            </a>
        </button>
    </form>
</body>
</html>
